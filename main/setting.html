<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌面屏幕设置</title>
<style>
:root{color-scheme:light;--ink:#252a25;--muted:#62685e;--line:#d9ddd2;--accent:#a63e27}
*{box-sizing:border-box}
body{margin:0;background:#f2f1e9;color:var(--ink);font:16px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:auto;padding:32px 16px}
header{padding:0 8px 24px}
.kicker{font:11px/1.5 monospace;letter-spacing:2px;color:var(--muted)}
h1{margin:10px 0;font:600 30px/1.3 "Songti SC","Noto Serif CJK SC",serif}
h1 span{font:400 16px/1.6 sans-serif;margin-left:12px;color:var(--muted)}
p{margin:8px 0}
.hint{font-size:14px;color:var(--muted)}
form{margin-bottom:16px;padding:22px;background:#fffef9;border:1px solid var(--line);border-radius:12px}
h2{display:flex;align-items:center;gap:12px;margin:0;font-size:19px}
h2 span{font:14px monospace;color:var(--accent)}
label{display:block;font-size:14px;margin:18px 0 6px}
input,select,button{font:inherit;border-radius:6px;min-height:46px}
input,select{width:100%;padding:10px 12px;border:1px solid #969e90;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--ink);padding:10px 16px;background:var(--ink);color:#fff}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:wait}
button[type=submit]{width:100%;margin-top:20px}
.password,.timing{display:flex;gap:10px}
.password input,.timing>div{min-width:0;flex:1}
.quiet{background:transparent;color:var(--ink);border-color:var(--line)}
.feedback{font-size:14px;overflow-wrap:anywhere;margin:12px 0 0}
.feedback:empty{display:none}
.feedback[data-state=error]{color:#a12e1c}
.feedback[data-state=success]{color:#326335}
#exit{padding:0 8px;background:none;border:0}
#exit button{margin-top:0}
footer{text-align:center;font-size:12px;color:var(--muted);padding-top:8px}
@media(max-width:360px){form{padding:18px 14px}.timing{display:block}main{padding-top:24px}}
</style>
</head>
<body>
<main>
<header>
  <div class="kicker">DESKTOP SCREEN / SETTINGS</div>
  <h1>桌面屏幕<span>设置</span></h1>
  <p class="hint">各项分别保存，完成后返回设备主页。</p>
</header>
<noscript>请启用浏览器的 JavaScript 后再保存设置。</noscript>
<form id="network" data-path="/wifi_data" data-done="Wi-Fi 配置已保存，设备正在尝试连接。是否联网成功，请查看设备或串口日志。">
  <h2><span>01</span>连接 Wi-Fi</h2>
  <p class="hint" id="wifi-help">填写路由器的 2.4 GHz Wi-Fi，不是设备的「桌面屏幕」热点。</p>
  <label for="wifi">Wi-Fi 名称</label>
  <input id="wifi" name="wifi_name" placeholder="例如：Home Wi-Fi" maxlength="31" required autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="wifi-help">
  <label for="code">Wi-Fi 密码</label>
  <div class="password">
    <input id="code" name="wifi_code" type="password" placeholder="请输入 Wi-Fi 密码" maxlength="63" required autocomplete="new-password" autocapitalize="none" spellcheck="false">
    <button type="button" class="quiet" id="reveal" aria-controls="code" aria-pressed="false">显示</button>
  </div>
  <button type="submit">保存并连接</button>
  <p class="feedback" role="status"></p>
</form>
<form data-path="/tomato_data" data-done="番茄钟设置已保存。">
  <h2><span>02</span>番茄钟</h2>
  <p class="hint">留一段专注时间，也记得休息。</p>
  <div class="timing">
    <div><label for="work_time">专注时长</label>
      <select id="work_time" name="work_time">
        <option value="5">5 分钟</option><option value="10">10 分钟</option>
        <option value="15">15 分钟</option><option value="20" selected>20 分钟</option>
      </select>
    </div>
    <div><label for="rest_time">休息时长</label>
      <select id="rest_time" name="rest_time">
        <option value="5" selected>5 分钟</option><option value="10">10 分钟</option>
        <option value="15">15 分钟</option><option value="20">20 分钟</option>
      </select>
    </div>
  </div>
  <label for="time_count">重复轮数</label>
  <select id="time_count" name="time_count">
    <option value="1">1 轮</option><option value="2">2 轮</option>
    <option value="3" selected>3 轮</option><option value="4">4 轮</option>
  </select>
  <button type="submit">保存番茄钟</button>
  <p class="feedback" role="status"></p>
</form>
<form data-path="/city_data" data-done="天气城市已保存。">
  <h2><span>03</span>天气城市</h2>
  <label for="city">选择城市</label>
  <select id="city" name="city">
    <option value="guangzhou">广州</option><option value="shenzhen">深圳</option>
    <option value="shanghai">上海</option><option value="beijing" selected>北京</option>
  </select>
  <button type="submit">保存城市</button>
  <p class="feedback" role="status"></p>
</form>
<form id="exit" data-path="/back" data-done="设备已返回主页，可以关闭此网页。">
  <input type="hidden" name="back" value="back">
  <button type="submit" class="quiet">返回设备主页</button>
  <p class="feedback" role="status"></p>
</form>
<footer>设置保存在设备中，无需连接互联网。</footer>
</main>
<script>
const wifi=document.getElementById('wifi'),password=document.getElementById('code');
document.getElementById('reveal').onclick=function(){
  const show=password.type==='password';
  password.type=show?'text':'password';
  this.textContent=show?'隐藏':'显示';
  this.setAttribute('aria-pressed',String(show));
};
let busy=false;
for(const form of document.querySelectorAll('form[data-path]')){
  const notice=form.querySelector('[role=status]');
  form.addEventListener('input',()=>{
    wifi.setCustomValidity('');password.setCustomValidity('');
    if(!busy)notice.textContent='';
  });
  form.addEventListener('submit',event=>{
    event.preventDefault();
    if(busy)return;
    if(form.id==='network'){
      wifi.setCustomValidity(new Blob([wifi.value]).size>31?'Wi-Fi 名称过长，最多 31 字节（中文通常占 3 字节）。':'');
      const size=new Blob([password.value]).size;
      password.setCustomValidity(size<8||size>63?'密码需为 8–63 字节，请检查后重试。':'');
    }
    if(!form.reportValidity())return;
    const data=Object.fromEntries(new FormData(form));
    const buttons=document.querySelectorAll('button[type=submit]');
    busy=true;
    buttons.forEach(button=>button.disabled=true);
    form.setAttribute('aria-busy','true');
    notice.dataset.state='pending';
    notice.textContent=form.id==='exit'?'正在返回主页…':'正在保存，请稍候…';
    function finish(message,state){
      busy=false;
      buttons.forEach(button=>button.disabled=false);
      form.removeAttribute('aria-busy');
      notice.dataset.state=state;
      notice.textContent=message;
    }
    const request=new XMLHttpRequest();
    request.onload=()=>{
      if(request.status>=200&&request.status<300)finish(form.dataset.done,'success');
      else finish('保存未完成（HTTP '+request.status+'），请重试。','error');
    };
    request.onerror=()=>finish('连接中断，请确认仍连接「桌面屏幕」热点后重试。配置可能已保存，可先查看设备状态。','error');
    request.ontimeout=()=>finish('等待设备响应超时，请查看设备状态后重试。','error');
    try{
      request.open('POST',form.dataset.path,true);
      request.timeout=12000;
      request.setRequestHeader('Content-Type','application/json');
      request.send(JSON.stringify(data));
    }catch(error){finish('无法发送，请确认已连接「桌面屏幕」热点后重试。','error');}
  });
}
</script>
</body>
</html>
